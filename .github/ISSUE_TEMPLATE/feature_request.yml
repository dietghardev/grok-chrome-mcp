name: Feature request
description: Suggest a tool or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task you want Grok to do in the browser, not the API you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: perms
    attributes:
      label: Permissions
      options:
        - label: This would act on page content, so it should require an origin grant
